<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fawn's Mark Plotter</title>
<meta name="description" content="Pick your club and tonight's course, get the plotted course and compass headings for every mark.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1720">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛵</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="map-container">
  <div id="map"></div>

  <button type="button" id="info-btn" class="fab fab-top-left" title="About / data sources" aria-label="About">ⓘ</button>
  <button type="button" id="locate-btn" class="fab fab-top-right" title="Show my location" aria-label="Locate me">📍</button>

  <div id="leg-nav" class="leg-nav" hidden>
    <button type="button" id="leg-prev-btn" class="leg-nav-btn" aria-label="Previous leg">▲</button>
    <div class="leg-nav-info">
      <div class="leg-nav-step" id="leg-nav-step">1 / 1</div>
      <div class="mark-badge leg-nav-badge" id="leg-nav-target-badge">A</div>
      <div class="leg-nav-heading" id="leg-nav-heading">000°T</div>
      <div class="leg-nav-dist" id="leg-nav-dist">0.00 nm</div>
    </div>
    <button type="button" id="leg-next-btn" class="leg-nav-btn" aria-label="Next leg">▼</button>
  </div>
</div>

<div id="sheet" class="sheet">
  <button type="button" id="sheet-toggle" class="sheet-toggle">
    <span id="sheet-toggle-label">Build course</span>
    <span id="sheet-toggle-icon" class="chev">▲</span>
  </button>

  <div id="leg-strip" class="leg-strip" hidden></div>

  <div id="sheet-body" class="sheet-body">
    <div class="row compact-row">
      <select id="club-select" class="compact"></select>
      <select id="series-select" class="compact" hidden></select>
      <select id="mbsa-list-select" class="compact" hidden>
        <option value="mbsa_A">MBSA List A</option>
        <option value="mbsa_B">MBSA List B</option>
        <option value="mbsa_C">MBSA List C</option>
      </select>
    </div>
    <p class="hint" id="list-hint"></p>

    <div class="row mark-input-row">
      <div class="mark-input-wrap">
        <input type="text" id="mark-input" placeholder="Type a mark, or a whole course: A H F G" autocomplete="off" autocapitalize="characters">
        <ul id="mark-suggestions" class="suggestions" hidden></ul>
      </div>
      <button type="button" id="add-mark-btn" class="square-btn">+</button>
    </div>

    <div id="course-chips" class="chips"></div>

    <div class="row heading-options">
      <label class="checkbox-label"><input type="checkbox" id="use-magnetic"> Magnetic</label>
      <label class="variation-label">Var
        <input type="number" id="variation" value="-14.6" step="0.1"> °
      </label>
      <button type="button" id="clear-course-btn" class="text-btn">Clear</button>
    </div>

    <div class="row action-row">
      <button type="button" id="gps-start-btn" class="secondary-btn">📍 GPS Start</button>
      <button type="button" id="mark-start-btn" class="secondary-btn">⚓ Mark Start</button>
    </div>
    <div class="row action-row">
      <button type="button" id="set-course-btn" class="primary-btn">Set Course ▶</button>
    </div>
    <p class="hint" id="build-status"></p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/app.js"></script>
</body>
</html>
